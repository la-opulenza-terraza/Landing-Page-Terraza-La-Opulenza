<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A6E42" />
      <stop offset="50%" stop-color="#7C5733" />
      <stop offset="100%" stop-color="#5A3A1C" />
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 10)">
    <!-- Architectural Arch / Diamond Emblem -->
    <path d="M 30,5 C 44,5 55,16 55,30 L 55,50 C 55,52 52,55 50,55 L 10,55 C 8,55 5,52 5,50 L 5,30 C 5,16 16,5 30,5 Z" 
          fill="none" stroke="url(#bronzeGrad)" stroke-width="2" />
    <path d="M 30,12 C 40,12 48,20 48,30 L 48,48 L 12,48 L 12,30 C 12,20 20,12 30,12 Z" 
          fill="none" stroke="#1B2462" stroke-width="1.2" opacity="0.6" />
    
    <!-- Stylized Monogram 'O' with Sunburst / Sparkle -->
    <circle cx="30" cy="30" r="10" fill="none" stroke="url(#goldShimmer)" stroke-width="2" />
    <circle cx="30" cy="30" r="3" fill="#7C5733" />
    <line x1="30" y1="15" x2="30" y2="17" stroke="url(#goldShimmer)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="43" x2="30" y2="45" stroke="url(#goldShimmer)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="17" y2="30" stroke="url(#goldShimmer)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="43" y1="30" x2="45" y2="30" stroke="url(#goldShimmer)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="78" y="32" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="600" letter-spacing="4" fill="#7C5733">TERRAZA</text>
  <text x="77" y="54" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#141414">LA OPULENZA</text>
  <text x="78" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#828282">EVENTOS EXCLUSIVOS • GDL</text>
</svg>
